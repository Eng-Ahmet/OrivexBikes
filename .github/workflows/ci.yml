name: QQBikes Continuous Integration (CI/CD) Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Frontend, Compile Backend & Run Automated Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Frontend & Compile Backend (ng build && tsc)
        run: npm run build

      - name: 🧪 Execute Backend Modular Route Integration Tests (66/66 Pass)
        run: npm test

      - name: 📑 Verify Built Output Artifacts
        run: |
          test -f frontend/public/index.html || (echo "Frontend index.html missing!" && exit 1)
          test -f dist/backend/src/server.js || (echo "Backend dist server.js missing!" && exit 1)

  docker-build:
    name: Validate & Build Docker Production Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image (docker compose build)
        run: docker compose build
