<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQBikes - Rental & Store Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Custom Dark Theme & Custom Overrides -->
  <link rel="stylesheet" href="../src/styles/main.css" />
</head>
<body class="bg-dark text-light">

  <!-- Top Header Navigation Bar -->
  <header id="headerContainer" class="navbar navbar-expand-lg sticky-top border-bottom border-secondary-subtle px-3 px-md-4 bg-dark bg-gradient"></header>

  <!-- Main Grid Layout -->
  <div class="container-fluid py-3 px-3 px-md-4">
    <div class="row g-3">
      <!-- Sidebar Navigation Menu -->
      <aside id="sidebarContainer" class="col-12 col-md-2 col-xl-2 d-none d-md-block"></aside>

      <!-- Dynamic Page View Container -->
      <main id="pageContainer" class="col-12 col-md-10 col-xl-10"></main>
    </div>
  </div>

  <!-- Mobile Offcanvas Sidebar Drawer -->
  <div class="offcanvas offcanvas-start bg-dark text-light border-end border-secondary" tabindex="-1" id="mobileSidebarDrawer">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title text-info fw-bold"><i class="fa-solid fa-bicycle me-2"></i> QQBikes Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="mobileDrawerContainer"></div>
  </div>

  <!-- Modals Container -->
  <div id="modalsContainer"></div>

  <!-- Bootstrap 5.3.3 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Main JavaScript Entry Point -->
  <script type="module" src="../src/js/app.js"></script>
</body>
</html>
