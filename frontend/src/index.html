<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrivexBike - Rental & Store Management System | Orivex Technology</title>

  <!-- PWA Meta & Web Manifest Tags (PWABuilder Compliant) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="description" content="Professional bike & scooter rental management system, contracts, shift cash drawer audits, and repair workshop POS by Orivex Technology." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OrivexBike" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
  <link rel="shortcut icon" href="/assets/icon-192.png" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
  <app-root>
    <!-- Native PWA & Web App Initial Splash Screen (replaced automatically when Angular initializes) -->
    <div id="app-pwa-splash" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #0b0f19; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Inter', system-ui, sans-serif;">
      <div style="background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(13, 110, 253, 0.4); margin-bottom: 20px;">
        <i class="fa-solid fa-bicycle fa-2xl" style="color: #ffffff; font-size: 2.5rem;"></i>
      </div>
      <h1 style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.5px;">
        Orivex<span style="color: #0d6efd;">Bike</span>
      </h1>
      <span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; margin-bottom: 30px;">
        Powered by Orivex Technology
      </span>
      <div style="width: 48px; height: 48px; border: 3px solid rgba(13, 110, 253, 0.2); border-top-color: #0d6efd; border-radius: 50%; animation: pwa-spin 1s infinite linear;"></div>
      <style>
        @keyframes pwa-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </app-root>

  <!-- Bootstrap 5.3.3 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Service Worker Registration Script (PWABuilder Compliant) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('🚀 PWA Service Worker Registered! Scope:', reg.scope))
          .catch((err) => console.error('❌ Service Worker Registration Error:', err));
      });
    }
  </script>
</body>
</html>
